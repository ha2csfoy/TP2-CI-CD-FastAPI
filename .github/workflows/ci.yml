name: CI–FastAPI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install safety

      # Vérifier la sécurité des dépendances
      - name: Check for security issues
        run: safety check || true

  test:
    runs-on: ubuntu-24.04
    needs: security
    steps:
      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Installer les dépendances dev
      - name: Install dependencies (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip list

      # Tests automatisés avec mesure de la couverture
      - name: Run tests with coverage
        run: |
          export PYTHONPATH=$(pwd)
          python -m pytest --maxfail=1 --disable-warnings -q --cov=app --cov-report=xml --cov-report=term-missing
